{% extends 'base/base.html' %}
{% load static %}

{% block titulo %}Crear Informe{% endblock %}

{% block content %}
<div class="container">
  <section class="contact fade-up" id="contact">
    <div class="contact-container">
        
      <div class="section-header">
        <h2 class="section-title">Crear Informe</h2>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <p id="registerError" style="color:red;"></p>
        <p class="section-subtitle">Devs</p>
      </div>

      <div class="contact-form-wrapper">
        <div class="contact-form">

          <form id="createForm" action="{% url 'crearInforme' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
              <label for="title">Título</label>
              <input type="text" id="title" name="title" placeholder="Título del informe" required>
            </div>

            <div class="form-group">
              <label for="description">Contenido del Informe</label>
              {{ form.media }}  
              {{ form.description }}
            </div>

            <button type="submit" class="btn-primary btn-submit">Crear</button>
          </form>

        </div>
      </div>

    </div>
  </section>
</div>
{% endblock %}
