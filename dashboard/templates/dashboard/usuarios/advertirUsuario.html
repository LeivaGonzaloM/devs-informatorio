{% extends 'dashboard/baseAdmin.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4">

  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="card">
        <div class="card-body p-4">

          <h4 class="fw-semibold mb-4">
            <i class="ti ti-alert-circle text-warning"></i> Enviar Advertencia
          </h4>

          <p class="text-muted mb-4">
            Estás a punto de enviar una advertencia al usuario:
            <strong class="text-dark">{{ usuario.username }}</strong>
          </p>

          <form action="{% url 'advertirUsuario' usuario.id %}" method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Mensaje de advertencia</label>
              <textarea name="mensaje" rows="5" class="form-control" placeholder="Ingrese el motivo o advertencia para el usuario" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Gravedad</label>
              <select class="form-select" name="nivel" required>
                <option value="leve">⚪ Leve</option>
                <option value="media">🟡 Media</option>
                <option value="grave">🔴 Grave</option>
              </select>
            </div>

            <!-- NUEVO: DURACIÓN -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Duración</label>
              <select class="form-select" name="duracion" required>
                <option value="24h">📅 24 horas</option>
                <option value="3d">📅 3 días</option>
                <option value="1w">📅 1 semana</option>
                <option value="1m">📅 1 mes</option>
                <option value="perm">♾ Permanente</option>
              </select>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancelar
              </a>

              <button type="submit" class="btn btn-warning text-white">
                <i class="ti ti-send"></i> Enviar advertencia
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
