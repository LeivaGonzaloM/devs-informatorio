{% extends 'dashboard/baseAdmin.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
        <br><br><br><br><br><br>
      <div class="card">
        <div class="card-body p-4">
          <h4 class="fw-semibold mb-4">
            <i class="ti ti-user-x text-danger"></i> Eliminar Usuario
          </h4>

          <p class="text-muted mb-4">
            Estás a punto de eliminar al siguiente usuario:
          </p>

          <form action="{% url 'eliminar_usuario' %}" method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Selecciona un usuario</label>
              <select class="form-select" name="usuario" required>
                <option value="" disabled selected>-- Selecciona un usuario --</option>
                {% for usuario in usuarios %}
                  <option value="{{ usuario.id }}">{{ usuario.username }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancelar
              </a>

              <button type="submit" class="btn btn-danger">
                <i class="ti ti-trash"></i> Eliminar Usuario
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
