{% extends 'dashboard/baseAdmin.html' %}
{% load static %}

{% block content %}
<div class="body-wrapper-inner">
  <div class="container-fluid">

    <!-- ===================== Formulario de bloqueo de usuario ===================== -->
    <div class="row mt-4">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title fw-semibold mb-4">Bloquear Usuario</h5>

            <form method="POST" action="{% url 'blockUsuario' %}">
              {% csrf_token %}
              
              <!-- Lista de usuarios -->
              <div class="mb-3">
                <label for="user" class="form-label">Selecciona un Usuario:</label>
                <select name="user" id="user" class="form-select">
                  <option value="">-- Selecciona un usuario --</option>
                  {% for user in users %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Selección de tiempo -->
              <div class="mb-3">
                <label for="time" class="form-label">Selecciona una unidad de tiempo:</label>
                <select name="time_unit" id="time_unit" class="form-select">
                  <option value="minutes">Minutos</option>
                  <option value="hours">Horas</option>
                  <option value="days">Días</option>
                </select>
              </div>

              <!-- Input de cantidad de tiempo -->
              <div class="mb-3">
                <label for="time_value" class="form-label">Cantidad:</label>
                <input type="number" class="form-control" id="time_value" name="time_value" min="1" required>
              </div>

              <!-- Botón de envío -->
              <div class="mb-3">
                <button type="submit" class="btn btn-danger">Bloquear Usuario</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
