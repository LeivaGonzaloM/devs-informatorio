{% extends 'base/base.html' %} 
{% load static %}

{% block titulo %}Crear Artículo{%endblock %} 

{% block content %}
<div class="container">
  <section class="contact fade-up" id="contact">
    <div class="contact-container">
        <div class="section-header">
                    <h2 class="section-title">Crear Artículo</h2>
                    <p style="color: red;">{{error}}</p>
                    <p id="registerError" style="color:red;"></p>
                    <p class="section-subtitle">Devs</p>
        </div>

                
        <div class="contact-form-wrapper">
            <div class="contact-form">
                    <form id="createForm" action="{% url 'crearPost' %}" method="POST" enctype="multipart/form-data">
                      {% csrf_token %}
                        <div class="form-group">
                            <label for="name">Titulo</label>
                            <input type="text" id="name" name="title" placeholder="Titulo" required>
                        </div>

                        <div class="form-group">
                            <label for="email">imagen</label>
                            <input type="file" id="imagen" name="image" placeholder="ingresar imagen" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Escribe tu Artículo</label>
                            <textarea id="message" name="description" rows="5" placeholder="Ingresar artículo" required></textarea>
                        </div>

                        <button type="submit" class="btn-primary btn-submit">Crear</button>
                    </form>
            </div>
        </div>
    </div>
  </section>
</div>
{% endblock %}
