{% extends 'base/base.html' %} 
{% load static %}

{% block titulo %}Contactanos{%endblock %} 

{% block content %}
<div class="container">
  <!-- Contact Section -->
    <section class="contact fade-up" id="contact">
        <div class="contact-container">
            <div class="section-header">
                <h2 class="section-title">Contactanos</h2>
                <p class="section-subtitle">Equipo DEVS con atención 24hs</p>
            </div>
            
            <div class="contact-form-wrapper">
                <div class="contact-form">
                    <div class="form-group">
                        <label for="name">Titulo</label>
                        <input type="text" id="name" name="name" placeholder="Titulo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea id="message" name="message" rows="5" placeholder="Ingrese su mensaje" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-submit">Enviar</button>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
